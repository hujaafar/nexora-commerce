# BUY-01 learning header
# File purpose: Externalizes runtime settings for product-service.
# Learning focus: Spring profiles, environment-variable overrides, health checks, and service discovery.
server:
  port: ${PORT:8082}

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/buy01_products}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

app:
  events:
    product-topic: ${PRODUCT_EVENTS_TOPIC:marketplace.product-events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Seller-owned catalog for BUY-01
