# File purpose: Defines one SonarQube project that analyzes all six Spring
# Boot services and the Angular client together.
sonar.projectKey=nexora-commerce
sonar.projectName=Nexora Commerce E-commerce Platform
sonar.sourceEncoding=UTF-8

# SonarQube accepts comma-separated module roots, so service boundaries remain
# visible while one dashboard summarizes the whole platform.
sonar.sources=discovery-service/src/main/java,gateway-service/src/main/java,user-service/src/main/java,product-service/src/main/java,media-service/src/main/java,order-service/src/main/java,frontend/src
sonar.tests=discovery-service/src/test/java,gateway-service/src/test/java,user-service/src/test/java,product-service/src/test/java,media-service/src/test/java,order-service/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*Tests.java,frontend/src/**/*.spec.ts

# Java analysis needs bytecode from the Maven verify stage. The wildcard finds
# each module's independently compiled classes.
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.java.libraries=**/target/dependency/*.jar
sonar.java.test.libraries=**/target/dependency/*.jar
sonar.junit.reportPaths=discovery-service/target/surefire-reports,gateway-service/target/surefire-reports,user-service/target/surefire-reports,product-service/target/surefire-reports,media-service/target/surefire-reports,order-service/target/surefire-reports
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Angular's CI test command writes LCOV for SonarQube and Cobertura/JUnit for
# human-readable Jenkins reports.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,frontend/coverage/frontend/lcov.info

# Generated output and third-party assets are not authored application code.
sonar.exclusions=**/target/**,frontend/src/**/*.spec.ts,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/public/**,**/generated-sources/**
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/dto/**,**/model/**,**/exception/**,frontend/src/main.ts,frontend/src/**/*.routes.ts

# Waiting converts a red Quality Gate into a non-zero scanner exit code. That
# is what stops Jenkins/GitHub before deployment or merge.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# A resource-limited local SonarQube server may spend more than the scanner's
# default HTTP read timeout processing the report. These transport limits match
# the five-minute gate limit; they allow a real answer but never bypass it.
sonar.scanner.socketTimeout=300
sonar.scanner.responseTimeout=300
