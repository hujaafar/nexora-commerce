# BUY-01 learning header
# File purpose: Externalizes runtime settings for user-service.
# Learning focus: Spring profiles, environment-variable overrides, health checks, and service discovery.
server:
  port: ${PORT:8081}

spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/buy01_users}
      auto-index-creation: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    issuer: buy-01-user-service
    expiration: ${JWT_EXPIRATION:8h}

app:
  seed-demo-users: ${SEED_DEMO_USERS:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mongo:
      enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Authentication and profiles for BUY-01
