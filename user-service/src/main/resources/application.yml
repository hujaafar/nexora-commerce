# File purpose: Externalizes runtime settings for user-service.
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 10m
      tracking-modes: cookie
      cookie:
        name: NEXORA_OAUTH
        path: /api/auth/oauth2
        http-only: true
        same-site: lax
        secure: ${OAUTH_COOKIE_SECURE:false}

spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nexora_users}
      auto-index-creation: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    issuer: nexora-commerce-user-service
    expiration: ${JWT_EXPIRATION:8h}

app:
  public-origin: ${PUBLIC_ORIGIN:http://127.0.0.1:4200}
  oauth2:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    github-client-id: ${GITHUB_CLIENT_ID:}
    github-client-secret: ${GITHUB_CLIENT_SECRET:}
  seed-demo-users: ${SEED_DEMO_USERS:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mongo:
      enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Authentication and profiles for Nexora Commerce
