server:
  port: ${PORT:8083}

spring:
  application:
    name: media-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/buy01_media}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

app:
  media:
    max-bytes: 2097152
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media/images}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:marketplace}
    secret-key: ${S3_SECRET_KEY:marketplace-dev-password}
    bucket: ${S3_BUCKET:buy01-media}
  events:
    media-topic: ${MEDIA_EVENTS_TOPIC:marketplace.media-events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Secure image metadata and object storage for BUY-01
