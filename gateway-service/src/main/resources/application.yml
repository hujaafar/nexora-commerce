# File purpose: Externalizes runtime settings for gateway-service.
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth:
      requests: ${AUTH_RATE_LIMIT_REQUESTS:20}
      window: ${AUTH_RATE_LIMIT_WINDOW:60s}
    media:
      requests: ${MEDIA_RATE_LIMIT_REQUESTS:60}
      window: ${MEDIA_RATE_LIMIT_WINDOW:60s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: JWT-aware edge router for BUY-01
