# File purpose: Externalizes order-service database, security, integration, and event settings.
server:
  port: ${PORT:8084}

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nexora_orders}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}

app:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN:change-this-internal-service-token}
  events:
    order-topic: ${ORDER_EVENTS_TOPIC:marketplace.order-events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Cart, checkout, orders, wishlists, and analytics for Nexora Commerce
