name: nexora-artifacts
services:
  nexus:
    image: ${NEXUS_IMAGE:-sonatype/nexus3:3.95.3@sha256:c0b9c4a98e231a5865f67a07cea477c13bd3d5f3cac67746afa28622f9c15296}
    user: "200:200"
    restart: "no"
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms512m -Xmx1024m -XX:MaxDirectMemorySize=1024m
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    ports:
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_HTTP_PORT:-18081}:8081"
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_DOCKER_PORT:-18082}:8082"
    volumes:
      - nexus-data:/nexus-data
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/service/rest/v1/status >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 90s
volumes:
  nexus-data:
