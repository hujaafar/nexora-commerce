# Verified HTTPS on every HTTP hop. MongoDB/Kafka use their separate protocols
# on the local private network; this profile does not claim TLS for those.
# Run: scripts/tls-start.ps1 (or docs/HTTPS.md).
x-java-tls: &java-tls
  SERVER_SSL_ENABLED: 'true'
  SERVER_SSL_KEYSTORE: file:/certs/server.p12
  SERVER_SSL_KEYSTORETYPE: PKCS12
  SERVER_SSL_KEYSTOREPASSWORD: ${TLS_KEYSTORE_PASSWORD:?Generate certificates with scripts/tls-init.sh}
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -Djavax.net.ssl.trustStore=/trust/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit
x-discovery-tls: &discovery-tls
  EUREKA_URL: https://discovery-service:8761/eureka/
  EUREKA_CLIENT_TLS_ENABLED: 'true'
  EUREKA_INSTANCE_PREFERIPADDRESS: 'false'
  EUREKA_INSTANCE_NONSECUREPORTENABLED: 'false'
  EUREKA_INSTANCE_SECUREPORTENABLED: 'true'
services:
  discovery-service:
    environment:
      <<: *java-tls
    volumes:
      - ./certs/tls/discovery-service:/certs:ro
      - ./certs/tls/trust:/trust:ro
  user-service:
    environment:
      <<: [*java-tls, *discovery-tls]
      EUREKA_INSTANCE_HOSTNAME: user-service
      EUREKA_INSTANCE_SECUREPORT: '8081'
    volumes:
      - ./certs/tls/user-service:/certs:ro
      - ./certs/tls/trust:/trust:ro
  product-service:
    environment:
      <<: [*java-tls, *discovery-tls]
      EUREKA_INSTANCE_HOSTNAME: product-service
      EUREKA_INSTANCE_SECUREPORT: '8082'
    volumes:
      - ./certs/tls/product-service:/certs:ro
      - ./certs/tls/trust:/trust:ro
  media-service:
    environment:
      <<: [*java-tls, *discovery-tls]
      EUREKA_INSTANCE_HOSTNAME: media-service
      EUREKA_INSTANCE_SECUREPORT: '8083'
      S3_ENDPOINT: https://minio:9000
      MEDIA_PUBLIC_BASE_URL: https://localhost:8443/api/media/images
    volumes:
      - ./certs/tls/media-service:/certs:ro
      - ./certs/tls/trust:/trust:ro
  order-service:
    environment:
      <<: [*java-tls, *discovery-tls]
      EUREKA_INSTANCE_HOSTNAME: order-service
      EUREKA_INSTANCE_SECUREPORT: '8084'
      PRODUCT_SERVICE_URL: https://product-service:8082
    volumes:
      - ./certs/tls/order-service:/certs:ro
      - ./certs/tls/trust:/trust:ro
  gateway-service:
    environment:
      <<: [*java-tls, *discovery-tls]
      EUREKA_INSTANCE_HOSTNAME: gateway-service
      EUREKA_INSTANCE_SECUREPORT: '8080'
      ALLOWED_ORIGINS: https://localhost:8443
    volumes:
      - ./certs/tls/gateway-service:/certs:ro
      - ./certs/tls/trust:/trust:ro
  minio:
    command: server /data --console-address ':9001' --certs-dir /certs
    volumes:
      - ./certs/tls/minio:/certs:ro
      - ./certs/tls/trust:/trust:ro
    healthcheck:
      test: [CMD, curl, --fail, --cacert, /trust/ca.pem, 'https://localhost:9000/minio/health/live']
  frontend:
    ports: !override
      - '127.0.0.1:8443:443'
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/tls/frontend:/certs:ro
      - ./certs/tls/trust:/trust:ro
