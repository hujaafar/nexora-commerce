# File purpose: Orchestrates every application and infrastructure dependency locally.
name: nexora

services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-marketplace}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-marketplace-dev-password}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_HOST_PORT:-27117}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 8s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketplace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marketplace-dev-password}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9002}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  discovery-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE: discovery-service
    environment:
      PORT: 8761
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--Xms64m -Xmx256m}
      EUREKA_HOSTNAME: discovery-service
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DISCOVERY_HOST_PORT:-8761}:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/8761'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE: user-service
    environment:
      PORT: 8081
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--Xms64m -Xmx256m}
      EUREKA_URL: http://discovery-service:8761/eureka/
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-marketplace}:${MONGO_ROOT_PASSWORD:-marketplace-dev-password}@mongo:27017/nexora_users?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${USER_SERVICE_HOST_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/8081'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  product-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE: product-service
    environment:
      PORT: 8082
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--Xms64m -Xmx256m}
      EUREKA_URL: http://discovery-service:8761/eureka/
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-marketplace}:${MONGO_ROOT_PASSWORD:-marketplace-dev-password}@mongo:27017/nexora_products?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-this-internal-service-token}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PRODUCT_SERVICE_HOST_PORT:-8082}:8082"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/8082'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  media-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE: media-service
    environment:
      PORT: 8083
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--Xms64m -Xmx256m}
      EUREKA_URL: http://discovery-service:8761/eureka/
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-marketplace}:${MONGO_ROOT_PASSWORD:-marketplace-dev-password}@mongo:27017/nexora_media?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketplace}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-marketplace-dev-password}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:8080/media/images}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MEDIA_SERVICE_HOST_PORT:-8083}:8083"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/8083'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE: order-service
    environment:
      PORT: 8084
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--Xms64m -Xmx256m}
      EUREKA_URL: http://discovery-service:8761/eureka/
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-marketplace}:${MONGO_ROOT_PASSWORD:-marketplace-dev-password}@mongo:27017/nexora_orders?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-this-internal-service-token}
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ORDER_SERVICE_HOST_PORT:-8084}:8084"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/8084'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE: gateway-service
    environment:
      PORT: 8080
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--Xms64m -Xmx256m}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-60s}
      MEDIA_RATE_LIMIT_REQUESTS: ${MEDIA_RATE_LIMIT_REQUESTS:-60}
      MEDIA_RATE_LIMIT_WINDOW: ${MEDIA_RATE_LIMIT_WINDOW:-60s}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/8080'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-4200}:80"
    depends_on:
      gateway-service:
        condition: service_healthy

  demo-seed:
    image: node:22.12-alpine
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    command: [node, scripts/seed-demo.mjs, 'http://gateway-service:8080']

volumes:
  mongo-data:
  kafka-data:
  minio-data:
